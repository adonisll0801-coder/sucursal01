---
vlans:
  - id: 10
    name: USUARIOS_VLAN10
    network: 192.168.10.0/24
    gateway: 192.168.10.1
  - id: 20
    name: USUARIOS_VLAN20
    network: 192.168.20.0/24
    gateway: 192.168.20.1
  - id: 99
    name: GESTION
    network: 192.168.99.0/24
    gateway: 192.168.99.1

router:
  hostname: R-SUC-01
  trunk_interface: GigabitEthernet0/0
  trunk_description: Troncal hacia SW-SUC-01-CORE
  subinterfaces:
    - vlan: 10
      description: Gateway VLAN 10
      ip: 192.168.10.1
      mask: 255.255.255.0
    - vlan: 20
      description: Gateway VLAN 20
      ip: 192.168.20.1
      mask: 255.255.255.0
    - vlan: 99
      description: Gateway VLAN 99 GESTION
      ip: 192.168.99.1
      mask: 255.255.255.0
      native: true

switches:
  SW-SUC-01-CORE:
    mgmt_ip: 192.168.99.2
    mgmt_mask: 255.255.255.0
    mgmt_gateway: 192.168.99.1
    trunks:
      - interface: GigabitEthernet0/0
        description: Troncal hacia R-SUC-01
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
      - interface: GigabitEthernet1/2
        description: Troncal hacia SW-SUC-01-ACC1
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
    access_ports:
      - interface: GigabitEthernet0/1
        vlan: 10
        description: Acceso VLAN 10 PC1
      - interface: GigabitEthernet0/2
        vlan: 10
        description: Acceso VLAN 10 PC2
      - interface: GigabitEthernet1/0
        vlan: 20
        description: Acceso VLAN 20 PC3
      - interface: GigabitEthernet1/1
        vlan: 20
        description: Acceso VLAN 20 PC4
      - interface: GigabitEthernet0/3
        vlan: 99
        description: Acceso VLAN 99 PC7

  SW-SUC-01-ACC1:
    mgmt_ip: 192.168.99.3
    mgmt_mask: 255.255.255.0
    mgmt_gateway: 192.168.99.1
    trunks:
      - interface: GigabitEthernet0/0
        description: Troncal hacia SW-SUC-01-CORE
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
    access_ports:
      - interface: GigabitEthernet0/1
        vlan: 10
        description: Acceso VLAN 10 PC5
      - interface: GigabitEthernet0/2
        vlan: 20
        description: Acceso VLAN 20 PC6
      - interface: GigabitEthernet0/3
        vlan: 99
        description: Acceso VLAN 99 PC8
